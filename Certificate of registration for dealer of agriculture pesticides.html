<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        font-family: var(--poppins-semibold);
      }
      @import url("https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap");
/* @[assetImgPath] */
      :root {
        --poppins-semibold: "poppins-semibold", sans-serif;
      }

      .container {
        position: absolute;
        background-image: url(/images/border.png);
        width: 99%;
        height: 99%;
        min-height: 900px;
        background-size: cover;
      }

      .background-img {
        position: absolute;
        height: 30rem;
        top: 25%;
        left: 19.5%;
        z-index: -1;
        opacity: .4;
      }

      .center {
        text-align: center;
      }

      .form-container {
        width: 100%;
        margin: auto;
      }

      p,
      span,
      li,
      strong,
      .form-label {
        font-size: 16px;
      }

      .header {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
      }

      .text-main,
      .logo {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
      }

      .logo {
        transform: translateY(-135%);
      }

      .header > h1 {
        margin: 0px;
        font-size: 30px;
        color: #277443;
        text-transform: uppercase;
      }

      .subtitle {
        color: #277443;
      }

      .form-inner-cell {
        width: 100%;
        display: flex;
        align-items: flex-end;
      }

      .form-line-short {
        border-bottom: 1px solid black;
        width: 150px;
      }

      .form-line-middle {
        border-bottom: 1px solid black;
        width: 300px;
      }

      .form-line-long {
        flex: 1;
        border-bottom: 1px solid black;
        width: 90%;
      }

      .form-label {
        width: max-content;
      }

      .form-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
      }

      .form-row2 {
        display: flex;
        align-items: center;
        margin-bottom: 15px;
        gap: 20px;
      }

      .row {
        border: 1px solid black;
        padding: 7px 5px;
        display: flex;
        align-items: flex-end;
        gap: 10px;
      }

      @page {
        size: a4;
        margin: 0.5rem;
        orientation: portrait;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="content">
        <img src="images/coat_of_arms_agriculture_department.svg" alt="" class="background-img" />
        <div class="" style="padding-top: 40px; padding-inline: 60px; padding-bottom: 0px">
          <div class="header">
            <div class="text-main" style="width: 100%">
              <img src="images/text-curved.svg" width="100%" alt="logo" />
            </div>
            <div class="logo">
            
            </div>
          </div>
         
        </div>
      </div>
    </div>
  </body>
</html>
