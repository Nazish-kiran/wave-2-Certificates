<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
            @import url("https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap");
      
      /* @[assetImgPath] */
      :root {
        --poppins-semibold: "poppins-semibold", sans-serif;
      }
      body {
        font-family: "Times New Roman", Times, serif;
      }
      /* @[assetImgPath] */
      .container {
        position: absolute;
        background-image: url(logos/border.png);
        width: 99%;
        height: 99%;
        min-height: 900px;
        background-size: cover;
        left: 4px;
      }
      .background-img {
        position: absolute;
        height: 28rem;
        top: 30%;
        left: 23%;
        z-index: -1;
      }
      .center {
        text-align: center;
      }

      .short-line {
        display: inline;
        box-sizing: border-box;
        border-bottom: 1px solid black;
        width: auto;
        padding-left: 5px;
        word-wrap: break-word;
      }
      .head-info span {
        font-style: italic;
        font-weight: 600;
        font-size: 9.5px;
      }
      .head-info {
        margin-bottom: 10px;
      }
      .head-info div {
        line-height: 12.8px;
      }
      .top-content p {
        line-height: 20px;
        text-align: justify;
      }
      p,
      span,
      li {
        font-size: 15px;
      }

      @page {
        size: a4;
        margin: 0.5rem;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="content">
        <img
          src="logos/Coat_of_arms_of_Sindh_Province.svg 1.png"
          alt=""
          class="background-img"
        />
        <div
          class=""
          style="padding-top: 30px; padding-inline: 35px; padding-bottom: 0px"
        >
          <div class="top-content">
            <div style="display: flex; align-items: flex-start; gap: 10px; ">
              <img src="logos/kmc-logo.png" width="115px" alt="" />
              <h1
                class="center"
                style="
                  font-size: 23px;
                  text-transform: uppercase;
                  font-weight: 700;
                  margin-bottom: 5px;
                  text-decoration: underline;
                  text-align: center;
                "
              >
                Karachi Metropolitan Corporation <br />
                <span style="font-size: 19px;"> Directorate of katchi abadies </span>
              </h1>
            </div>
            <div
              style="
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-top: 30px;
                margin-bottom: 20px;
                
              "
            >
              <p style="margin: 0; font-family: var(--poppins-semibold);">
                Book No.<span class="short-line">&nbsp;</span>
              </p>
              <p style="margin: 0; font-family: var(--poppins-semibold);">
                Serial No.
                <span class="short-line" style="width: 130px"> &nbsp;</span>
              </p>
            </div>
              <div
              style="
                display: flex;
                justify-content: space-between;
                align-items: center;
              "
            >
              <p style="margin: 0; font-family: var(--poppins-semibold);">
                No. M.O/KA/KMC<span class="short-line">&nbsp;</span>/20
              </p>
              
              <p style="margin: 0; font-family: var(--poppins-semibold);">
                Dated.
                <span class="short-line" style="width: 130px"> &nbsp;</span>
              </p>
            </div>
            <div style="position: absolute;width: 98%;">
                <p style="text-transform: uppercase;text-decoration: underline;font-weight: 700;font-size: 20px;text-align: center;margin-top: 0px;translate: 0px -23px;">PERMISSION TO MORTAGAGE</p>
            </div>
          </div>
          <div
            style="
              display: flex;
              justify-content: flex-end;
              align-items: flex-end;
              position: absolute;
              width: 92%;
              bottom: 27px;
              left: 30px;
            "
          >
            <div>
              <img src="logos/image 1.png" width="79px" alt="" />
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
