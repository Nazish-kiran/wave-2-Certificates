<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: "Times New Roman", Times, serif;
        font-weight: 700;
      }
      /* @[assetImgPath] */

      .container {
        position: absolute;
        background-image: url(logos/border-land.png);
        width: 99%;
        height: 99%;
        min-height: 690px;
        background-size: 100%;
      }
    .background-img {
        position: absolute;
        height: 28rem;
        top: 19%;
        left: 33%;
        z-index: -1;
      }
      .center {
        text-align: center;
      }

      .short-line {
        display: inline;
        box-sizing: border-box;
        border-bottom: 1px solid black;
        width: auto;
        padding-left: 5px;
        word-wrap: break-word;
      }
      .head-info span {
        font-style: italic;
        font-weight: 600;
        font-size: 9.5px;
      }
      .head-info {
        margin-bottom: 10px;
      }
      .head-info div {
        line-height: 12.8px;
      }
      .top-content p {
        line-height: 20px;
        text-align: justify;
      }
      p,
      span,
      li {
        font-size: 16px;
      }

      @page {
        size: a4 landscape;
        margin: 0.5rem;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="content">
        <img
          src="logos/Coat_of_arms_of_Sindh_Province.svg 1.png"
          alt=""
          class="background-img"
        />
        <div
          class=""
          style="padding-top: 30px; padding-inline: 40px; padding-bottom: 0px"
        >
          <div class="top-content">
            <div style="display: flex; align-items: center; position: relative">
              <img src="logos/image 4.svg" width="120px" alt="" />

              <h1
                style="
                  position: absolute;
                  left: 50%;
                  transform: translateX(-50%);
                  font-size: 28px;
                  text-transform: uppercase;
                  font-weight: 700;
                  margin: 0;
                  text-align: center;
                  width: 100%;
                "
              >
                TOWN MUNICIPAL CORPORATION <br />
                <span class="short-line">&nbsp;</span>
              </h1>
            </div>

            <div
              style="
                display: flex;
                justify-content: space-between;
                margin-bottom: 30px;
              "
            >
              <p style="margin: 0">
                S. NO:<span class="short-line">&nbsp;</span>
              </p>
              <p style="margin: 0;line-height: 22px;">
                Date of Issue:<span class="short-line">&nbsp;</span> <br />
                Due Date:<span class="short-line">&nbsp;</span> <br />B.G.
                No:<span class="short-line">&nbsp;</span> <br />
                A/c No:<span class="short-line">&nbsp;</span> <br />Sindh Bank
                Ltd.
              </p>
            </div>
          </div>
          <p>Department:<span class="short-line">&nbsp;</span></p>
          <table
            style="width: 100%; border-collapse: collapse; table-layout: fixed"
          >
            <tr>
              <th
                style="
                  border: 1px solid #000;
                  width: 18%;
                  padding: 6px;
                  font-weight: bold;
                  text-align: center;
                "
              >
                Name &amp; Address
              </th>
              <th
                style="
                  border: 1px solid #000;
                  width: 64%;
                  padding: 6px;
                  font-weight: bold;
                  text-align: center;
                "
              >
                Description
              </th>
              <th
                style="
                  border: 1px solid #000;
                  width: 18%;
                  padding: 6px;
                  font-weight: bold;
                  text-align: center;
                "
              >
                Amount
              </th>
            </tr>
            <tr>
              <td
                rowspan="7"
                style="border: 1px solid #000; vertical-align: top"
              ></td>
              <td
                rowspan="7"
                style="border: 1px solid #000; vertical-align: top"
              ></td>
              <td style="border: 1px solid #000; height: 30px"></td>
            </tr>
            <tr>
              <td style="border: 1px solid #000; height: 30px"></td>
            </tr>
            <tr>
              <td style="border: 1px solid #000; height: 30px"></td>
            </tr>
            <tr>
              <td style="border: 1px solid #000; height: 30px"></td>
            </tr>
            <tr>
              <td style="border: 1px solid #000; height: 30px"></td>
            </tr>
            <tr>
              <td style="border: 1px solid #000; height: 30px"></td>
            </tr>
            <tr>
              <td style="border: 1px solid #000; height: 30px"></td>
            </tr>
          </table>
          <p>Rupees in Words:<span class="short-line">&nbsp;</span></p>
          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: flex-end;
              position: absolute;
              width: 92%;
              bottom: 27px;
              left: 30px;
            "
          >
            <p style="margin-top: 0px; margin-bottom: 0px; text-align: center">
              Signature of <br />
              Concerned Official
            </p>
            <p style="text-align: center;">
              <span style="font-weight: 400;">
                Incharge Temporary Land <br />
              </span>
              Sign With Stamp <br />
              Concerned Officer
            </p>
            <div style="display: flex;gap: 20px;align-items: flex-end;">
              <p style="text-align: center;margin-bottom: 0px;">
                Receiving Officer <br />
                Sindh Bank Ltd.
              </p>
              <img src="logos/image 1.png" width="79px" alt="" />
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
